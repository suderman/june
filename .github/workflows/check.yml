name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Nix (v31.11.1)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24

      # The package typechecks; the check runs the daemon's tests and the org-dispatch and org-edit tests.
      - name: Build and test
        run: nix build .#default .#checks.x86_64-linux.default --no-link -L
